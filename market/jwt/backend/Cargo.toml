[package]
name = "tfm-jwt"
description = "ToolForge market plugin: JWT decoder, verifier, signer and JWE decryption"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
# cdylib 编译为 WASM 组件，rlib 供本机单元测试
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
tf-plugin-api.workspace = true
tf-plugin-guest = { path = "../../../crates/tf-plugin-guest" }
data-encoding = "2"
jiff = "0.2"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto", "use_pem"] }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
rsa = { version = "0.9", features = ["sha2", "pem"] }
sha2 = "0.10"

[dev-dependencies]
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "rand_core"] }
p256 = { version = "0.13", features = ["pem", "pkcs8"] }
rand = "0.8"
rsa = { version = "0.9", features = ["pem"] }
