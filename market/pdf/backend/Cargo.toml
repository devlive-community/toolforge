[package]
name = "tfm-pdf"
description = "ToolForge market plugin: merge, split, rotate and reorder PDF pages"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
# cdylib 编译为 WASM 组件，rlib 供本机单元测试
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
tf-plugin-api.workspace = true
tf-plugin-guest = { path = "../../../crates/tf-plugin-guest" }
data-encoding = "2"
hayro = "0.7"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
# 关闭默认的 rayon：WASM 沙箱不能开线程
lopdf = { version = "0.45", default-features = false, features = ["chrono-clock"] }
