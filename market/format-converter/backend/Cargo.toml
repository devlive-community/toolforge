[package]
name = "tfm-format-converter"
description = "ToolForge market plugin: JSON / YAML / TOML / CSV / XML / INI / properties converter"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
# cdylib 编译为 WASM 组件，rlib 供本机单元测试
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
tf-plugin-api.workspace = true
tf-plugin-guest = { path = "../../../crates/tf-plugin-guest" }
csv = "1"
json5 = "1"
quick-xml = "0.42"
serde_yaml_ng = "0.10"
toml = { version = "1", features = ["preserve_order"] }
