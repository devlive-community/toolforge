[package]
name = "tfm-curl-converter"
description = "ToolForge market plugin: convert curl commands to code"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
# cdylib 编译为 WASM 组件，rlib 供本机单元测试
crate-type = ["cdylib", "rlib"]

[features]
# 作为插件打包时导出组件；http-client 只复用解析器，关闭后避免重复导出
default = ["plugin"]
plugin = []

[dependencies]
data-encoding = "2"
serde.workspace = true
serde_json.workspace = true
tf-plugin-api.workspace = true
tf-plugin-guest = { path = "../../../crates/tf-plugin-guest" }
