[package]
name = "tfm-json-schema"
description = "ToolForge market plugin: offline JSON Schema validation"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
# cdylib 编译为 WASM 组件，rlib 供本机单元测试
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
tf-plugin-api.workspace = true
tf-plugin-guest = { path = "../../../crates/tf-plugin-guest" }
jsonschema = { version = "0.58.6", default-features = false, features = ["idna", "arbitrary-precision"] }
