[package]
name = "tfm-random"
description = "ToolForge market plugin: random numbers, draws, shuffles, groups, dice and coins with optional verifiable seeds"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
# cdylib 编译为 WASM 组件，rlib 供本机单元测试
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
tf-plugin-api.workspace = true
tf-plugin-guest = { path = "../../../crates/tf-plugin-guest" }
rand = "0.9"
rand_chacha = "0.9"
sha2 = "0.11"
