[package]
name = "tfm-table-converter"
description = "ToolForge market plugin: convert tables between Markdown, CSV, TSV, HTML, JSON, SQL and more"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
# cdylib 编译为 WASM 组件，rlib 供本机单元测试
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
tf-plugin-api.workspace = true
tf-plugin-guest = { path = "../../../crates/tf-plugin-guest" }
csv = "1"
unicode-width = "0.2"
