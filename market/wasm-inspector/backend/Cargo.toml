[package]
name = "tfm-wasm-inspector"
description = "ToolForge market plugin: read-only WebAssembly module inspector"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
# cdylib 编译为 WASM 组件，rlib 供本机单元测试
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
tf-plugin-api.workspace = true
tf-plugin-guest = { path = "../../../crates/tf-plugin-guest" }
wasmparser = { version = "0.258", default-features = false, features = ["std", "validate", "features", "simd", "hash-collections"] }
wasmprinter = { version = "0.258", default-features = false, features = ["validate"] }

[dev-dependencies]
wasm-encoder = "0.258"
