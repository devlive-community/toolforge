[package]
name = "tfm-image-stitcher"
description = "ToolForge plugin: stitch images side by side, in a column or a grid"
version = "0.2.0"
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
tf-plugin-api.workspace = true
tf-plugin-guest = { path = "../../../crates/tf-plugin-guest" }
data-encoding = "2"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
lopdf = "0.45"
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }
