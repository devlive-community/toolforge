[package]
name = "tfm-collection-ledger"
description = "ToolForge market plugin: personal collection inventory with conserved lending and returns"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
# cdylib 编译为 WASM 组件，rlib 供本机单元测试
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
tf-plugin-api.workspace = true
tf-plugin-guest = { path = "../../../crates/tf-plugin-guest" }
data-encoding = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
