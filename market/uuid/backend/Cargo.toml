[package]
name = "tfm-uuid"
description = "ToolForge market plugin: UUID / ULID / NanoID generator"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
# cdylib 编译为 WASM 组件，rlib 供本机单元测试
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
tf-plugin-api.workspace = true
tf-plugin-guest = { path = "../../../crates/tf-plugin-guest" }
jiff = "0.2"
nanoid = "0.5"
ulid = "3"
uuid = { version = "1", features = ["v1", "v3", "v4", "v5", "v6", "v7", "std"] }
