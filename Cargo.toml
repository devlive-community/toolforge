[workspace]
resolver = "3"
members = [
    "apps/desktop/src-tauri",
    "crates/tf-core",
    "crates/tf-plugin-api",
    "crates/tf-package",
    "crates/tf-plugin-guest",
    "crates/tf-net",
    "crates/tf-wasm",
    "crates/xtask",
    "plugins/*/backend",
    "market/*/backend",
]
exclude = ["crates/tf-wasm/fixture", "market/xml-formatter/backend/vendor/sxd-xpath"]

[workspace.package]
version = "0.2.2"
edition = "2024"
license = "MIT"
authors = ["qianmoQ"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
thiserror = "2"
tf-core = { path = "crates/tf-core" }
tf-plugin-api = { path = "crates/tf-plugin-api" }
tf-net = { path = "crates/tf-net" }
tf-package = { path = "crates/tf-package" }
tf-wasm = { path = "crates/tf-wasm" }
tfp-archive = { path = "plugins/archive/backend" }
tfp-background-remover = { path = "plugins/background-remover/backend" }
tfp-barcode = { path = "plugins/barcode/backend" }
tfp-base-converter = { path = "plugins/base-converter/backend" }
tfp-batch-rename = { path = "plugins/batch-rename/backend" }
tfp-certificate = { path = "plugins/certificate/backend" }
tfp-color = { path = "plugins/color/backend" }
tfp-cron = { path = "plugins/cron/backend" }
tfp-csv-viewer = { path = "plugins/csv-viewer/backend" }
tfp-curl-converter = { path = "plugins/curl-converter/backend" }
tfp-dns-lookup = { path = "plugins/dns-lookup/backend" }
tfp-disk-usage = { path = "plugins/disk-usage/backend" }
tfp-duplicate-finder = { path = "plugins/duplicate-finder/backend" }
tfp-encoder = { path = "plugins/encoder/backend" }
tfp-format-converter = { path = "plugins/format-converter/backend" }
tfp-hash = { path = "plugins/hash/backend" }
tfp-image-converter = { path = "plugins/image-converter/backend" }
tfp-image-compressor = { path = "plugins/image-compressor/backend" }
tfp-image-info = { path = "plugins/image-info/backend" }
tfp-input-stats = { path = "plugins/input-stats/backend" }
tfp-ip-calculator = { path = "plugins/ip-calculator/backend" }
tfp-json-formatter = { path = "plugins/json-formatter/backend" }
tfp-json-to-code = { path = "plugins/json-to-code/backend" }
tfp-local-server = { path = "plugins/local-server/backend" }
tfp-log-viewer = { path = "plugins/log-viewer/backend" }
tfp-markdown-editor = { path = "plugins/markdown-editor/backend" }
tfp-mock-data = { path = "plugins/mock-data/backend" }
tfp-ocr = { path = "plugins/ocr/backend" }
tfp-password = { path = "plugins/password/backend" }
tfp-pdf = { path = "plugins/pdf/backend" }
tfp-text-encoding = { path = "plugins/text-encoding/backend" }
tfp-icon-generator = { path = "plugins/icon-generator/backend" }
tfp-hex-viewer = { path = "plugins/hex-viewer/backend" }
tfp-folder-compare = { path = "plugins/folder-compare/backend" }
tfp-number-words = { path = "plugins/number-words/backend" }
tfp-url-parser = { path = "plugins/url-parser/backend" }
tfp-json-query = { path = "plugins/json-query/backend" }
