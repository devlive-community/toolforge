[package]
name = "toolforge"
description = "ToolForge desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "toolforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
url = "2"
log = "0.4"
serde.workspace = true
serde_json.workspace = true
tf-core.workspace = true
tf-host.workspace = true
tf-package.workspace = true
sha2 = "0.11"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "http2", "rustls-no-provider", "system-proxy", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
uuid = { version = "1", features = ["v4"] }
httpdate = "1"
tf-wasm.workspace = true
tf-plugin-api.workspace = true
tfp-archive.workspace = true
tfp-background-remover.workspace = true
tfp-barcode.workspace = true
tfp-batch-rename.workspace = true
tfp-certificate.workspace = true
tfp-csv-viewer.workspace = true
tfp-dns-lookup.workspace = true
tfp-disk-usage.workspace = true
tfp-duplicate-finder.workspace = true
tfp-hash.workspace = true
tfp-image-converter.workspace = true
tfp-image-compressor.workspace = true
tfp-image-info.workspace = true
tfp-input-stats.workspace = true
tfp-local-server.workspace = true
tfp-log-viewer.workspace = true
tfp-ocr.workspace = true
tfp-pdf.workspace = true
tfp-text-encoding.workspace = true
tfp-icon-generator.workspace = true
tfp-hex-viewer.workspace = true
tfp-folder-compare.workspace = true
tfp-json-query.workspace = true
tfp-image-palette.workspace = true
tfp-doc-converter.workspace = true
tfp-env-editor.workspace = true
tfp-context-menu.workspace = true
tfp-port-manager.workspace = true
tfp-proxy-inspector.workspace = true
tfp-qrcode.workspace = true
tfp-regex.workspace = true
tfp-svg-converter.workspace = true
tfp-ssh-key.workspace = true
tfp-system-monitor.workspace = true
tfp-websocket.workspace = true
tfp-xlsx-viewer.workspace = true
zip = { version = "4", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSButton", "NSControl", "NSResponder", "NSView", "NSWindow"] }
