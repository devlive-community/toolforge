[package]
name = "toolforge"
description = "ToolForge desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "toolforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde.workspace = true
serde_json.workspace = true
tf-core.workspace = true
tf-plugin-api.workspace = true
tfp-base-converter.workspace = true
tfp-color.workspace = true
tfp-encoder.workspace = true
tfp-format-converter.workspace = true
tfp-hash.workspace = true
tfp-image-converter.workspace = true
tfp-json-formatter.workspace = true
tfp-jwt.workspace = true
tfp-regex.workspace = true
tfp-sql-formatter.workspace = true
tfp-text-diff.workspace = true
tfp-text-tools.workspace = true
tfp-timestamp.workspace = true
tfp-uuid.workspace = true
tfp-xml-formatter.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSButton", "NSControl", "NSResponder", "NSView", "NSWindow"] }
