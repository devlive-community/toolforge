[package]
name = "tf-plugin-guest"
description = "Guest-side bindings that turn a ToolPlugin into a ToolForge WASM component"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde_json.workspace = true
tf-plugin-api.workspace = true
wit-bindgen = "0.57"

# 本机构建（插件单元测试）时直接使用原生网络实现；WASM 组件经宿主函数调用
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tf-net = { path = "../tf-net" }
