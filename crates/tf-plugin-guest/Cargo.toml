[package]
name = "tf-plugin-guest"
description = "Guest-side bindings that turn a ToolPlugin into a ToolForge WASM component"
# 同 tf-plugin-api：SDK 版本不随应用发版继承 workspace 版本，避免发布
# 流水线把每次应用版本升级都当成插件输入变化。
version = "0.2.2"
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde_json.workspace = true
tf-plugin-api.workspace = true
wit-bindgen = "0.57"

# 本机构建（插件单元测试）时直接使用原生网络实现；WASM 组件经宿主函数调用
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tf-net = { path = "../tf-net" }
