[package]
name = "tf-net"
description = "Native networking for ToolForge plugins: HTTP requests and loopback callbacks"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
tf-plugin-api.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["blocking", "http2", "rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tiny_http = "0.12"
url = "2"
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rustls-platform-verifier = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[dev-dependencies]
hyper = { version = "1", features = ["server", "http1", "http2"] }
tokio = { version = "1", features = ["macros"] }
http-body-util = { version = "0.1", features = ["channel"] }
