name: Plugins

# 在线插件（market/*）变更推送到默认分支 dev 后打包、签名，并发布到滚动的 `plugins` 预发布版本：
# 每个插件一个 .tfp，外加应用读取的 registry.json。签名私钥来自仓库机密 TOOLFORGE_PLUGIN_KEY。
on:
  push:
    branches: [dev]
    paths:
      - "market/**"
      - "wit/**"
      - "crates/tf-plugin-api/**"
      - "crates/tf-plugin-guest/**"
      - "crates/tf-package/**"
      - "packages/plugin-build/**"
      - ".github/workflows/plugins.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plugins
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BASE_URL: https://github.com/${{ github.repository }}/releases/download/plugins

jobs:
  publish:
    name: Pack and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          key: plugins
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Pack plugins
        env:
          TOOLFORGE_PLUGIN_KEY: ${{ secrets.TOOLFORGE_PLUGIN_KEY }}
        run: |
          if [ -z "$TOOLFORGE_PLUGIN_KEY" ]; then
            echo "::error::TOOLFORGE_PLUGIN_KEY is not set; refusing to publish unsigned plugins"
            exit 1
          fi
          for dir in market/*/; do
            cargo xtask plugin pack "$(basename "$dir")"
          done
          cargo xtask plugin index dist/plugins "$BASE_URL"
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view plugins >/dev/null 2>&1; then
            gh release create plugins --prerelease --title "Plugins" \
              --notes "Installable ToolForge plugins. The app reads registry.json from this release."
          fi
          gh release upload plugins dist/plugins/* --clobber
