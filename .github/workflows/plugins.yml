name: Plugins

# Official bytes live in COS. Every app download goes through the statistics API.
on:
  push:
    branches: [dev]
    paths:
      - 'market/**'
      - 'packages/plugin-ui-sdk/**'
      - 'packages/plugin-build/**'
      - 'crates/tf-plugin-api/**'
      - 'crates/tf-plugin-guest/**'
      - 'crates/tf-package/**'
      - 'crates/xtask/**'
      - 'wit/**'
      - 'Cargo.lock'
      - 'pnpm-lock.yaml'
      - 'scripts/publish-plugins.sh'
      - 'scripts/migrate-plugin-assets.sh'
      - '.github/workflows/plugins.yml'
  workflow_dispatch:
    inputs:
      bootstrap:
        description: 'Allow first COS catalog initialization after checking existing assets'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: plugins-production
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: plugins
  PLUGIN_ASSET_BASE_URL: https://plugins.toolforge.devlive.org
  PLUGIN_STATS_BASE_URL: https://stats.toolforge.devlive.org

jobs:
  build:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - name: Install WASM target and build trusted tools without signing secrets
        run: |
          # Pin a specific toolchain: a channel name (stable) makes rustup sync
          # channel updates on every shim call, and a mid-build sync replaced
          # rustc while cargo was compiling (run 39738297419).
          rustup toolchain install 1.99.1 --profile minimal --target wasm32-wasip2
          rustup default 1.99.1
          cargo build --locked --release -p xtask
          pnpm install --frozen-lockfile
          shellcheck scripts/publish-plugins.sh scripts/migrate-plugin-assets.sh
          cargo test --locked -p xtask
      - name: Read complete GitHub history without changing historical bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/migrate-plugin-assets.sh dist/plugins
      - name: Read existing COS catalog and find unpublished versions
        env:
          BOOTSTRAP: ${{ inputs.bootstrap || false }}
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --proto '=https' --connect-timeout 10 --max-time 60 --header 'Cache-Control: no-cache' --output "$RUNNER_TEMP/prior-catalog.json" --write-out '%{http_code}' "$PLUGIN_ASSET_BASE_URL/release-catalog.json?run=$GITHUB_RUN_ID&attempt=$GITHUB_RUN_ATTEMPT")
          case "$status" in
            200) jq -e '.schemaVersion == 1 and (.sourceCommit | test("^[a-f0-9]{40}$"))' "$RUNNER_TEMP/prior-catalog.json" >/dev/null ;;
            404) [[ $BOOTSTRAP == true ]] || { echo '::error::First COS catalog publication requires an explicit bootstrap run'; exit 1; }; rm "$RUNNER_TEMP/prior-catalog.json" ;;
            *) echo "::error::Cannot read COS catalog (HTTP $status)"; exit 1 ;;
          esac
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess, tomllib
          root = pathlib.Path('dist/plugins')
          assets = {a['name'] for a in json.loads((root / 'previous-release.json').read_text())['assets']}
          prior_path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'prior-catalog.json'
          prior = json.loads(prior_path.read_text()) if prior_path.exists() else None
          # A previous run may have published COS but only partially mirrored GitHub.
          # Recover its exact signed bytes rather than rebuilding an existing version.
          if prior:
              for item in prior['plugins']:
                  name = f"{item['id']}-{item['version']}.tfp"
                  if name in assets:
                      continue
                  key = f"packages/{item['id']}/{item['version']}/{item['sha256']}.tfp"
                  if item['objectKey'] != key or not re.fullmatch(r'[a-z0-9][a-z0-9.+-]*\.tfp', name) or not re.fullmatch(r'[a-f0-9]{64}', item['sha256']):
                      raise SystemExit('Unsafe existing COS catalog metadata')
                  target = root / 'previous' / name
                  result = subprocess.check_output(['curl', '--silent', '--show-error', '--proto', '=https', '--connect-timeout', '10', '--max-time', '120', '--max-filesize', '67108864', '--output', str(target), '--write-out', '%{http_code}', os.environ['PLUGIN_ASSET_BASE_URL'] + '/' + key], text=True)
                  if result != '200' or target.stat().st_size != item['size'] or hashlib.sha256(target.read_bytes()).hexdigest() != item['sha256']:
                      raise SystemExit('Cannot recover verified historical COS bytes')
                  assets.add(name)
          # Compare only packages reachable from each WASM backend. Native App-only lock
          # updates must not force every online plugin to publish a new version.
          cargo_changed = set()
          manifests = {}
          if prior:
              changed = subprocess.check_output(['git', 'diff', '--name-only', prior['sourceCommit'], 'HEAD', '--', 'Cargo.lock'], text=True)
              if changed.strip():
                  old_lock = tomllib.loads(subprocess.check_output(['git', 'show', prior['sourceCommit'] + ':Cargo.lock'], text=True))
                  new_lock = tomllib.loads(pathlib.Path('Cargo.lock').read_text())
                  key = lambda p: (p['name'], p['version'], p.get('source'))
                  old_packages = {key(p): p for p in old_lock['package']}
                  new_packages = {key(p): p for p in new_lock['package']}
                  metadata = json.loads(subprocess.check_output(['cargo', 'metadata', '--locked', '--format-version', '1', '--filter-platform', 'wasm32-wasip2'], text=True))
                  packages = {p['id']: p for p in metadata['packages']}
                  nodes = {n['id']: n for n in metadata['resolve']['nodes']}
                  manifests = {str(pathlib.Path(p['manifest_path']).resolve()): p['id'] for p in metadata['packages']}
                  for ident, package in packages.items():
                      if old_packages.get(key(package)) != new_packages.get(key(package)):
                          cargo_changed.add(ident)
          pending = []
          for path in sorted(pathlib.Path('market').glob('*/manifest.json')):
              manifest = json.loads(path.read_text())
              slug = path.parent.name
              if not slug.replace('-', '').isalnum():
                  raise SystemExit('Unsafe plugin slug')
              name = f"{manifest['id']}-{manifest['version']}.tfp"
              if name not in assets:
                  pending.append(slug)
              elif prior:
                  changed = subprocess.check_output(['git', 'diff', '--name-only', prior['sourceCommit'], 'HEAD', '--', str(path.parent), 'packages/plugin-ui-sdk', 'packages/plugin-build', 'crates/tf-plugin-api', 'crates/tf-plugin-guest', 'wit', 'pnpm-lock.yaml'], text=True)
                  dependency_changed = False
                  if cargo_changed:
                      manifest_path = str((path.parent / 'backend' / 'Cargo.toml').resolve())
                      frontier = [manifests[manifest_path]]
                      seen = set()
                      while frontier:
                          ident = frontier.pop()
                          if ident in seen:
                              continue
                          seen.add(ident)
                          frontier.extend(dep['pkg'] for dep in nodes[ident]['deps'])
                      dependency_changed = bool(seen & cargo_changed)
                  if changed.strip() or dependency_changed:
                      raise SystemExit(f'{slug}: published plugin inputs changed without a version bump')
          (root / 'pending.txt').write_text(''.join(slug + '\n' for slug in pending))
          PY
      - name: Build unsigned candidates without signing credentials
        run: |
          mkdir -p dist/unsigned
          while IFS= read -r slug; do
            target/release/xtask plugin pack "$slug" --unsigned --out dist/unsigned
          done < dist/plugins/pending.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: plugin-candidates-${{ github.run_id }}
          path: |
            dist/unsigned/
            dist/plugins/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  publish:
    needs: build
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    environment: plugins-production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build the trusted signing tool on a clean runner
        run: |
          cargo build --locked --release -p xtask
          cargo test --locked -p xtask
          shellcheck scripts/publish-plugins.sh scripts/migrate-plugin-assets.sh
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: plugin-candidates-${{ github.run_id }}
          path: dist
      - name: Independently read current history with the publishing identity
        env:
          GH_TOKEN: ${{ github.token }}
          BOOTSTRAP: ${{ inputs.bootstrap || false }}
        run: |
          scripts/migrate-plugin-assets.sh dist/verified-history
          cp dist/verified-history/previous-release.json dist/plugins/previous-release.json
          cp -a dist/verified-history/previous/. dist/plugins/previous/
          status=$(curl --silent --show-error --proto '=https' --connect-timeout 10 --max-time 60 --header 'Cache-Control: no-cache' --output "$RUNNER_TEMP/prior-catalog.json" --write-out '%{http_code}' "$PLUGIN_ASSET_BASE_URL/release-catalog.json?run=$GITHUB_RUN_ID&attempt=$GITHUB_RUN_ATTEMPT&phase=publish")
          case "$status" in
            200) jq -e '.schemaVersion == 1 and (.sourceCommit | test("^[a-f0-9]{40}$"))' "$RUNNER_TEMP/prior-catalog.json" >/dev/null ;;
            404) [[ $BOOTSTRAP == true ]] || { echo '::error::First COS catalog publication requires an explicit bootstrap run'; exit 1; }; rm "$RUNNER_TEMP/prior-catalog.json" ;;
            *) echo "::error::Cannot read COS catalog (HTTP $status)"; exit 1 ;;
          esac
      - name: Independently sign candidates using the precompiled tool
        env:
          TOOLFORGE_PLUGIN_KEY: ${{ secrets.TOOLFORGE_PLUGIN_KEY }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for package in dist/unsigned/*.tfp; do
            target/release/xtask plugin sign "$package" --out dist/plugins
          done
      - name: Validate complete inventory and generate registry and catalog
        run: |
          target/release/xtask plugin verify dist/plugins
          previous=()
          if [[ -f "$RUNNER_TEMP/prior-catalog.json" ]]; then
            previous=(--merge-catalog "$RUNNER_TEMP/prior-catalog.json")
          fi
          target/release/xtask plugin index dist/plugins "$PLUGIN_STATS_BASE_URL" --source-commit "$GITHUB_SHA" --generation "$GITHUB_RUN_NUMBER" "${previous[@]}"
      - name: Install pinned COSCLI and verify its official release checksum
        run: |
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --output "$RUNNER_TEMP/coscli" https://github.com/tencentyun/coscli/releases/download/v1.0.8/coscli-v1.0.8-linux-amd64
          printf '%s  %s\n' '7165f2ae16c5f7ac495864c963ca574a76e04ec72680d7bc8a8eee3234d8cf91' "$RUNNER_TEMP/coscli" | sha256sum --check --status
          chmod 700 "$RUNNER_TEMP/coscli"
      - name: Publish verified objects, import catalog, then publish registry
        env:
          GH_TOKEN: ${{ github.token }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_SESSION_TOKEN: ${{ secrets.COS_SESSION_TOKEN }}
          COS_REGION: ${{ vars.COS_REGION || 'ap-singapore' }}
          COS_BUCKET: toolforge-1258585472
          PLUGIN_CATALOG_SSH_TARGET: ${{ vars.PLUGIN_CATALOG_SSH_TARGET }}
          PLUGIN_CATALOG_SSH_KEY: ${{ secrets.PLUGIN_CATALOG_SSH_KEY }}
          PLUGIN_SSH_KNOWN_HOSTS: ${{ secrets.PLUGIN_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          task_dir=$(mktemp -d "$RUNNER_TEMP/plugin-publish.XXXXXX")
          trap 'rm -rf "$task_dir"' EXIT
          export COS_CONFIG_PATH="$task_dir/cos.yaml" PLUGIN_SSH_KEY_PATH="$task_dir/id" PLUGIN_SSH_KNOWN_HOSTS_PATH="$task_dir/known_hosts"
          export COSCLI_BIN="$RUNNER_TEMP/coscli" XTASK_BIN=target/release/xtask
          python3 - <<'PY'
          import json, os, pathlib, re
          for key in ('COS_SECRET_ID','COS_SECRET_KEY','PLUGIN_CATALOG_SSH_KEY','PLUGIN_SSH_KNOWN_HOSTS'):
              if not os.environ.get(key):
                  raise SystemExit(f'Missing protected publishing configuration: {key}')
          region = os.environ['COS_REGION']
          if not re.fullmatch(r'[a-z]+-[a-z]+', region):
              raise SystemExit('Invalid COS region')
          config = {'cos': {'base': {'secretid': os.environ['COS_SECRET_ID'], 'secretkey': os.environ['COS_SECRET_KEY'], 'sessiontoken': os.environ.get('COS_SESSION_TOKEN', ''), 'protocol': 'https', 'disableencryption': 'true', 'disableautofetchbuckettype': 'true'}, 'buckets': [{'name': os.environ['COS_BUCKET'], 'alias': os.environ['COS_BUCKET'], 'region': region, 'endpoint': f'cos.{region}.myqcloud.com'}]}}
          # JSON is also valid YAML. Never pass credentials as process arguments or print this file.
          pathlib.Path(os.environ['COS_CONFIG_PATH']).write_text(json.dumps(config))
          pathlib.Path(os.environ['PLUGIN_SSH_KEY_PATH']).write_text(os.environ['PLUGIN_CATALOG_SSH_KEY'] + '\n')
          pathlib.Path(os.environ['PLUGIN_SSH_KNOWN_HOSTS_PATH']).write_text(os.environ['PLUGIN_SSH_KNOWN_HOSTS'] + '\n')
          PY
          unset COS_SECRET_ID COS_SECRET_KEY COS_SESSION_TOKEN PLUGIN_CATALOG_SSH_KEY PLUGIN_SSH_KNOWN_HOSTS
          scripts/publish-plugins.sh dist/plugins
