name: Plugins

# 在线插件独立于应用版本发布：market/*/manifest.json 的 version 递增并推送到 dev 后，
# 只打包签名「plugins」发布中还没有的版本，上传 .tfp 并合并更新 registry.json。
# 应用从 releases/download/plugins/registry.json 读取插件索引，用户在工具市场中即可更新。
# 版本号不变的改动不会发布；签名私钥来自仓库机密 TOOLFORGE_PLUGIN_KEY。
on:
  push:
    branches: [dev]
    paths:
      - "market/*/manifest.json"
      # 发布逻辑变化时补发尚未发布的版本（已发布的版本会被跳过）
      - ".github/workflows/plugins.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plugins
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: plugins
  BASE_URL: https://github.com/${{ github.repository }}/releases/download/plugins

jobs:
  publish:
    name: Publish changed plugins
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Find versions not published yet
        id: pending
        run: |
          assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' 2>/dev/null || true)"
          slugs=""
          for manifest in market/*/manifest.json; do
            [ -e "$manifest" ] || continue
            slug="$(basename "$(dirname "$manifest")")"
            file="$(jq -r '.id + "-" + .version + ".tfp"' "$manifest")"
            if grep -qxF "$file" <<<"$assets"; then
              echo "$file is already published"
            else
              echo "$file will be published"
              slugs="$slugs $slug"
            fi
          done
          echo "slugs=${slugs# }" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6
        if: steps.pending.outputs.slugs != ''
      - uses: actions/setup-node@v7
        if: steps.pending.outputs.slugs != ''
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        if: steps.pending.outputs.slugs != ''
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        if: steps.pending.outputs.slugs != ''
        with:
          key: plugins
      - name: Install dependencies
        if: steps.pending.outputs.slugs != ''
        run: pnpm install --frozen-lockfile

      - name: Pack, sign and publish
        if: steps.pending.outputs.slugs != ''
        env:
          TOOLFORGE_PLUGIN_KEY: ${{ secrets.TOOLFORGE_PLUGIN_KEY }}
          SLUGS: ${{ steps.pending.outputs.slugs }}
        run: |
          if [ -z "$TOOLFORGE_PLUGIN_KEY" ]; then
            echo "::error::TOOLFORGE_PLUGIN_KEY is not set; refusing to publish unsigned plugins"
            exit 1
          fi
          for slug in $SLUGS; do
            cargo xtask plugin pack "$slug"
          done
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --prerelease --title "Plugins" \
              --notes "Installable ToolForge plugins, published independently of app releases. The app reads registry.json from here."
          fi
          # 在已发布的索引上合并，未变化的插件保持原条目
          merge=""
          if gh release download "$RELEASE_TAG" --pattern registry.json --dir previous 2>/dev/null; then
            merge="--merge previous/registry.json"
          fi
          cargo xtask plugin index dist/plugins "$BASE_URL" $merge
          gh release upload "$RELEASE_TAG" dist/plugins/*.tfp dist/plugins/registry.json --clobber
