name: Pull request

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  title:
    name: Conventional title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            test
            docs
            chore
            style
            i18n
            ci
          requireScope: false
          subjectPattern: ^[a-z].+[^.]$
          subjectPatternError: Subject must start with a lowercase letter and must not end with a period.
