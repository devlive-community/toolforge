name: Deploy website

# 工具目录来自 plugins/*/manifest.json 与 market/*/manifest.json（构建时扫描），
# 因此插件清单变动、版本发布与定时重建都会刷新站点。
on:
  push:
    branches: [main, dev]
    paths:
      - 'docs/**'
      - 'plugins/**'
      - 'market/**'
      - 'apps/desktop/src-tauri/tauri.conf.json'
      - '.github/workflows/site-deploy.yml'
  release:
    # published 偶发丢失（draft→publish / API 创建等场景），prereleased 覆盖预发布；
    # schedule 每日 03:00 UTC 兑底，必要时手动 workflow_dispatch
    types: [published, prereleased]
  schedule:
    # 每日 03:00 UTC 重建，保持版本号与更新日志新鲜
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          # docs 是独立 workspace（自带 pnpm-workspace.yaml 与锁文件），
          # 版本仍取自根 package.json 的 packageManager 声明
          working-directory: docs
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: docs
        run: pnpm install --frozen-lockfile
      - name: Test data pipeline
        working-directory: docs
        run: pnpm test
      - name: Build
        working-directory: docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/out

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
