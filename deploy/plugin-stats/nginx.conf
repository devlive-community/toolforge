# This file is included inside nginx's http context; keep existing sites intact.
limit_req_zone $binary_remote_addr zone=toolforge_stats_download:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=toolforge_stats_report:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=toolforge_stats_read:10m rate=120r/m;
log_format toolforge_stats '$time_iso8601 $request_method $uri $status $request_time';

server {
    listen 80;
    server_name stats.toolforge.devlive.org;
    # Use the administrator's existing ACME webroot and certificate automation.
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://stats.toolforge.devlive.org$request_uri; }
}

server {
    listen 443 ssl;
    server_name stats.toolforge.devlive.org;
    ssl_certificate /etc/letsencrypt/live/stats.toolforge.devlive.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stats.toolforge.devlive.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 4k;
    client_body_timeout 10s;
    access_log /var/log/nginx/toolforge-stats.access.log toolforge_stats;
    error_log /var/log/nginx/toolforge-stats.error.log warn;
    limit_req_status 429;
    add_header X-Content-Type-Options nosniff always;

    location = /readyz { return 404; }
    location = /healthz { return 404; }
    location ~ ^/v1/plugins/[^/]+/versions/[^/]+/download$ {
        limit_req zone=toolforge_stats_download burst=20 nodelay;
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host stats.toolforge.devlive.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_cache off;
    }
    location ~ ^/v1/downloads/[^/]+/complete$ {
        limit_req zone=toolforge_stats_report burst=40 nodelay;
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host stats.toolforge.devlive.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_cache off;
        add_header Cache-Control no-store always;
    }
    location /v1/ {
        limit_req zone=toolforge_stats_read burst=40 nodelay;
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host stats.toolforge.devlive.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }
    # 公共统计看板：服务进程内嵌的静态页与脚本/样式，仅这两个前缀可到达
    location = / {
        limit_req zone=toolforge_stats_read burst=40 nodelay;
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host stats.toolforge.devlive.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }
    location /assets/ {
        limit_req zone=toolforge_stats_read burst=40 nodelay;
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host stats.toolforge.devlive.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }
    location / { return 404; }
}
