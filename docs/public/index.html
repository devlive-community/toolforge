<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <title>ToolForge</title>
    <script>
      // 依据浏览器语言选择站点语言；静态托管无法做服务端重定向，用立即跳转兜底
      var lang = (navigator.language || '').toLowerCase().startsWith('zh') ? 'zh' : 'en'
      location.replace('/' + lang + '/')
    </script>
    <meta http-equiv="refresh" content="0;url=/zh/" />
  </head>
  <body>
    <a href="/zh/">ToolForge</a>
  </body>
</html>
