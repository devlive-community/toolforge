[package]
name = "tfp-archive"
description = "ToolForge plugin: browse, extract and create zip, tar and 7z archives"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
tf-plugin-api.workspace = true
bzip2 = "0.6"
flate2 = "1"
jiff = "0.2"
lzma-rust2 = "0.21"
ruzstd = "0.9"
sevenz-rust2 = "0.23"
tar = "0.4"
zip = { version = "8", default-features = false, features = ["aes-crypto", "deflate", "deflate64", "lzma", "bzip2", "xz"] }
