[package]
name = "tfp-icon-generator"
description = "ToolForge plugin: generate app icon sets for the web, iOS, Android, macOS and Windows"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
tf-plugin-api.workspace = true
data-encoding = "2"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "tiff", "webp"] }
resvg = "0.45"
