[package]
name = "tfp-ssh-key"
description = "ToolForge plugin: generate and inspect SSH keys"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
tf-plugin-api.workspace = true
md-5 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
rsa = { version = "0.9", default-features = false, features = ["std", "pem"] }
ssh-key = { version = "0.6", features = ["std", "ed25519", "p256", "p384", "p521", "rsa", "encryption", "alloc"] }
