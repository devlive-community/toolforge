[package]
name = "tfp-proxy-inspector"
description = "ToolForge plugin: read-only view of system proxy configuration sources"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
tf-plugin-api.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
system-configuration = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WinHttp", "Win32_Networking_WinInet", "Win32_System_Com", "Win32_System_Memory"] }
