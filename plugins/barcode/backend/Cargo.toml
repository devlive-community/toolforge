[package]
name = "tfp-barcode"
description = "ToolForge plugin: barcode generator and reader"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
tf-plugin-api.workspace = true
arboard = "3"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
resvg = "0.45"
rxing = { version = "0.9", default-features = false, features = ["oned", "datamatrix", "pdf417", "aztec", "qrcode", "encoders", "decoders", "multi_barcode_readers", "encoding_rs"] }
